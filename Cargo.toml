[workspace]
resolver = "2"
members = ["core", "desktop/src-tauri"]
exclude = ["third_party/localsend"]

# 以下 [profile.*] 自 desktop/src-tauri/Cargo.toml 迁入：workspace 规定 profile 只能定义在根（WB-1026/1031/1032）

# 发布构建优化：全程序 LTO + 去除符号
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# 分级优化（体积与速度兼得）：
# 全局 opt-level 3 保证速度；热点 crate（桌面端 + lanbackup-core）保持 3，
# 框架类重型依赖（UI 壳 / HTTP 栈 / TLS / 运行时 / SQLite 等）降到 "s"——
# 它们不是性能热点，体积可省 ~20%，运行速度几乎无感知。
[profile.release.package.backup-desktop]
opt-level = 3
[profile.release.package.lanbackup-core]
opt-level = 3

[profile.release.package.tauri]
opt-level = "s"
[profile.release.package.tauri-runtime-wry]
opt-level = "s"
[profile.release.package.tauri-utils]
opt-level = "s"
[profile.release.package.wry]
opt-level = "s"
