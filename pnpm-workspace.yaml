# pnpm workspace 配置（#35 monorepo）
#
# 工作区根目录：D:/code/tools/6a7f5d5699c44b33268ede69/
#
# 包说明：
#   - shared-core/     纯 TS，两端复用（pairing/crypto/transfer/scheduler...）
#   - shared-ui/       纯 TS/Vue，液态玻璃组件库（桌面端和移动端共用）
#   - desktop/         Tauri + Vue，桌面端应用
#   - mobile/          Capacitor + Vue，手机端应用（包含 local-receiver/ 子模块）
packages:
  - 'shared-core'
  - 'shared-ui'
  - 'desktop'
  - 'mobile'
allowBuilds:
  esbuild: true
  protobufjs: true
