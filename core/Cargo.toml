[package]
name = "lanbackup-core"
version = "0.1.0"
description = "局域网备份工具核心（V4 单一实现，桌面端与手机端共用）"
edition = "2021"
license = "MIT"

[lib]
name = "lanbackup_core"
# cdylib 供 Android JNI/uniFFI 使用；rlib 供桌面端 Tauri 直接依赖
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# ---------- 异步与 HTTP ----------
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
# **刻意不启用任何 TLS 后端**：本 crate 对 peer 的请求全部在局域网明文 http:// 上，
# TLS 栈是纯粹的死重。曾经带 `rustls-no-provider`，而它在没装 crypto provider 时
# `Client::builder().build()` 是 **panic** 而不是返回 Err ——
# 任何构造客户端的代码路径都会炸，且从函数签名上完全看不出来。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# ---------- 序列化 ----------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 契约即代码：从 Rust 类型生成 JSON Schema（见 V4-ARCHITECTURE.md §八）
schemars = "0.8"

# ---------- 密码学 ----------
#
# **RustCrypto 世代必须自洽**，这一段的版本号不是随便挑新的。
#
# 两个硬约束把可选范围锁死了：
#   1. `p256` 最新稳定版是 0.13，绑定 `rand_core 0.6` 与 `digest 0.10`（内部 sha2 0.10）
#   2. `hkdf` 至今没有 digest-0.11 世代的发布，最高仍是 0.12（digest 0.10）
#
# 曾经把这里升到「看起来更新」的 sha2 0.11 / hmac 0.13 / pbkdf2 0.13 / rand 0.10，
# 结果是 16 个编译错误，全部源于世代错配而非代码写错：
#   - `Hmac<Sha256>`（digest 0.11）不满足 hkdf 0.12 的 `HmacImpl<Sha256>`（digest 0.10）
#   - `ThreadRng`（rand_core 0.9）不满足 p256 的 `CryptoRngCore`（rand_core 0.6）
#
# 因此统一钉在 **digest-0.10 / rand_core-0.6** 世代：与 p256 的内部依赖完全重合，
# 依赖图里零重复版本。升级必须整代一起动（等 p256 0.14 与 hkdf 0.13 齐备），不许单点跳版。
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
pbkdf2 = "0.12"
hmac = "0.12"
ring = "0.17"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
base64 = "0.23"
hex = "0.4"

# ---------- 网络 ----------
if-addrs = "0.15"
socket2 = "0.6"

# ---------- 存储 ----------
rusqlite = { version = "0.31", features = ["bundled"] }

# ---------- 工具 ----------
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
log = "0.4"

# ---------- Android JNI（仅 Android 构建启用，默认关闭，避免把 jni 拖进桌面/CI 构建） ----------
# 启用 `android-jni` feature 后，`platform::android` 提供基于 JNI 的真实 `MulticastGuard`（M22）。
jni = { version = "0.21", optional = true }

# 发布优化：core 是性能热点，保持 opt-level 3
[profile.release.package.lanbackup-core]
opt-level = 3

[features]
default = []
# Android 侧接入真实组播锁（M22）：启用后 `platform::android` 提供基于 JNI 的
# `MulticastGuard` 实现，由 Android 侧把 `WifiManager` 经 JNI 注入 `PresenceSocket::bind_with_guard`。
android-jni = ["jni"]

[dev-dependencies]
# 协议 conformance：校验生成的 schema 与 golden file
jsonschema = "0.18"
