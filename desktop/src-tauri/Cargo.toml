[package]
name = "backup-desktop"
version = "0.1.0"
description = "局域网备份工具电脑端"
edition = "2021"

[lib]
name = "backup_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenTelemetry 可观测性预留（telemetry.rs 已删除，如需恢复在此启用）
# tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
# tracing-opentelemetry = "0.32"
# opentelemetry = { version = "0.31", features = ["trace"] }
# opentelemetry_sdk = { version = "0.31", features = ["trace", "rt-tokio"] }
# opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
# 使用 bundled 编译 SQLite 从源码（开发阶段暂不启用 SQLCipher，需 OpenSSL 环境）
# 要启用加密：将 features 改为 ["bundled", "sqlcipher"] 并确保 OPENSSL_DIR 环境变量指向 OpenSSL 安装目录
rusqlite = { version = "0.31", features = ["bundled"] }
# LocalSend 核心：HTTP 传输（v2 协议客户端 + 服务端）+ 设备发现
# http feature 自动包含 crypto（mTLS 证书等），这里用纯 HTTP 时 tls_config 传 None 即可
localsend = { path = "../../../docs/localsend-main/packages/core", features = ["http", "multicast"] }
tokio = { version = "1", features = ["full"] }
# 大文件流式上传（ReaderStream）
tokio-util = { version = "0.7", features = ["io"] }
# 上传流分块统计（块级进度事件）
futures-util = "0.3"
# 接收端冲突重命名时间戳格式化（MMDDhhmmss）
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
# AES-256-GCM 传输加密
ring = "0.17"
# PBKDF2（密钥派生，#9）
pbkdf2 = "0.13"
# HKDF-SHA256（v3 密钥派生树，RFC 5869；高熵输入走 HKDF，替代 PBKDF2 600k）
hkdf = "0.12"
# ECDH P-256（配对密钥交换，#8）
p256 = { version = "0.13", features = ["ecdh"] }
# base64 编解码（ECDH 公钥编码）
base64 = "0.21"
# 子网探测：枚举本机 IPv4 网段（配对/连接发现单播兜底）
if-addrs = "0.13"
# socket2：跨平台 TCP 选项（SO_REUSEADDR）
socket2 = "0.6"
# SHA-256（块校验 + Merkle 树）
sha2 = "0.10"
# 十六进制编码/解码（ETag 格式化）
hex = "0.4"
# 随机数（指数退避全抖动）
rand = "0.8"
# UUID（会话 ID 生成）
uuid = { version = "1", features = ["v4"] }
# xxHash64（弱校验快筛，非加密）
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# URL 编码（scheduler v1 扩展协议 HTTP 参数）
urlencoding = "2"
# 会话状态持久化（tauri-plugin-store）
tauri-plugin-store = "2"
# 单实例：重复启动时唤起已有实例而非再开一个（修复双实例抢占 53318/53317 导致服务异常）
tauri-plugin-single-instance = "2"
# 全局鼠标位置（让悬浮球无论鼠标在哪都看向它；纯前端只能收到球窗口内的事件）
mouse_position = "0.1"

[dev-dependencies]
# 协议 conformance：用 jsonschema 校验双端共享 Schema + Golden File（方案.txt §3.8/H.2，锁版本避免升级漂移）
jsonschema = "0.18"

# 发布构建优化：全程序 LTO + 去除符号
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# 分级优化（体积与速度兼得）：
# 全局 opt-level 3 保证速度；热点 crate（本程序 + localsend 传输核心）保持 3，
# 框架类重型依赖（UI 壳 / HTTP 栈 / TLS / 运行时 / SQLite 等）降到 "s"——
# 它们不是性能热点，体积可省 ~20%，运行速度几乎无感知。
[profile.release.package.backup-desktop]
opt-level = 3
[profile.release.package.localsend]
opt-level = 3
[profile.release.package.localsend-core]
opt-level = 3

[profile.release.package.tauri]
opt-level = "s"
