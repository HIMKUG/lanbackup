[package]
name = "backup-desktop"
version = "0.1.0"
description = "局域网备份工具电脑端"
edition = "2021"

[lib]
name = "backup_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenTelemetry 可观测性预留（telemetry.rs 已删除，如需恢复在此启用）
# tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
# tracing-opentelemetry = "0.32"
# opentelemetry = { version = "0.31", features = ["trace"] }
# opentelemetry_sdk = { version = "0.31", features = ["trace", "rt-tokio"] }
# opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
# 使用 bundled 编译 SQLite 从源码（开发阶段暂不启用 SQLCipher，需 OpenSSL 环境）
# 要启用加密：将 features 改为 ["bundled", "sqlcipher"] 并确保 OPENSSL_DIR 环境变量指向 OpenSSL 安装目录
rusqlite = { version = "0.31", features = ["bundled"] }
# V4 核心：协议与算法只此一份实现，桌面端直接依赖
lanbackup-core = { path = "../../core" }
# V4 HTTP 服务（桌面端接收服务器，基于 core SessionStore）
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
# 大文件流式上传（ReaderStream）
tokio-util = { version = "0.7", features = ["io"] }
# 上传流分块统计（块级进度事件）
futures-util = "0.3"
# 接收端冲突重命名时间戳格式化（MMDDhhmmss）
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
# AES-256-GCM 传输加密
ring = "0.17"
# PBKDF2（密钥派生，#9）
pbkdf2 = "0.13"
# HKDF-SHA256（v3 密钥派生树，RFC 5869；高熵输入走 HKDF，替代 PBKDF2 600k）
hkdf = "0.12"
# ECDH P-256（配对密钥交换，#8）
p256 = { version = "0.13", features = ["ecdh"] }
# base64 编解码（ECDH 公钥编码）
base64 = "0.21"
# 子网探测：枚举本机 IPv4 网段（配对/连接发现单播兜底）
if-addrs = "0.13"
# socket2：跨平台 TCP 选项（SO_REUSEADDR）
socket2 = "0.6"
# SHA-256（块校验 + Merkle 树）
sha2 = "0.10"
# 十六进制编码/解码（ETag 格式化）
hex = "0.4"
# 随机数（指数退避全抖动）
rand = "0.8"
# UUID（会话 ID 生成）
uuid = { version = "1", features = ["v4"] }
# xxHash64（弱校验快筛，非加密）
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# URL 编码（scheduler v1 扩展协议 HTTP 参数）
urlencoding = "2"
# 会话状态持久化（tauri-plugin-store）
tauri-plugin-store = "2"
# 单实例：重复启动时唤起已有实例而非再开一个（修复双实例抢占 53318/53317 导致服务异常）
tauri-plugin-single-instance = "2"
# 全局鼠标位置（让悬浮球无论鼠标在哪都看向它；纯前端只能收到球窗口内的事件）
mouse_position = "0.1"

[dev-dependencies]
